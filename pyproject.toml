
[project]
name = "zuspec-dataclasses"
dynamic = ["version"]
# Previously undeclared, which means "any Python at all" to a resolver -- pip
# would happily install this on 3.8 and fail at import. 3.10 is the floor the
# rest of the estate declares and the oldest interpreter this source compiles
# under.
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "zuspec-ir-core",
    "zuspec-be-py",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.entry-points."zuspec.solver.backend"]
python = "zuspec.dataclasses.solver.backend.python_backend:PythonSolverBackend"

[project.entry-points."flake8.extension"]
ZDC = "zuspec.dataclasses.flake8_zdc_struct:ZuspecFlake8Plugin"

[project.entry-points."zuspec.ir_checkers"]
Retargetable = "zuspec.dataclasses.ir_checker.retargetable:RetargetableIRChecker"
Python = "zuspec.dataclasses.ir_checker.python_profile:PythonIRChecker"

[project.entry-points."zuspec.profiles"]
Retargetable = "zuspec.dataclasses.profiles:RetargetableProfile"
Python = "zuspec.dataclasses.profiles:PythonProfile"

[project.entry-points."agent.skills"]
zuspec-dataclasses = "zuspec.dataclasses.skills:skills"

# Deprecated: kept for backward compatibility with older IVPM versions.
# Remove once consumers have migrated to the 'agent.skills' group.
[project.entry-points."ivpm.skill"]
zuspec-dataclasses = "zuspec.dataclasses.skills:skills"


[tool.setuptools.package-data]
"zuspec.dataclasses" = [
    "llms.txt",
    "py.typed"
]
"zuspec.dataclasses.skills" = [
    "SKILL.md",
    "resources/*.md",
]

